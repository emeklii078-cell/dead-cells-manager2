name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: project.zip ac ve derle
        run: |
          unzip -q -o project.zip -d proj
          s=$(find proj -name 'settings.gradle*' | head -1)
          echo "Proje klasoru: $(dirname "$s")"
          cd "$(dirname "$s")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DeadCellsModManager-apk
          path: proj/**/build/outputs/apk/debug/*.apk
